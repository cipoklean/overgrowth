<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Echo Arena</title>
<meta name="description" content="Every round, your past selves come back to hunt you. A one-thumb arena game.">
<meta property="og:title" content="Echo Arena">
<meta property="og:description" content="Every round, your past selves come back to hunt you.">
<meta name="theme-color" content="#0b0c10">
<style>
  html,body{margin:0;height:100%;background:#0b0c10;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  #mute{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:40px;height:40px;border-radius:20px;border:1px solid #3a3f4c;background:rgba(20,22,30,.7);color:#fff;font-size:18px;line-height:38px;text-align:center;padding:0;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="mute" aria-label="Mute">🔊</button>
<script src="./game.js"></script>
</body>
</html>
