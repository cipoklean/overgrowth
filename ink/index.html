<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ink Brawl</title>
<meta name="description" content="Stick-figure duels on a notebook page. Your rival learns how you fight.">
<meta property="og:title" content="Ink Brawl">
<meta property="og:description" content="Stick-figure duels. Your rival learns how you fight.">
<meta name="theme-color" content="#f4ecd8">
<style>
  html,body{margin:0;height:100%;position:fixed;inset:0;width:100%;background:#f4ecd8;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  *{touch-action:none;-ms-touch-action:none}
  canvas{display:block;touch-action:none}
  #pause{position:fixed;left:62px;bottom:calc(12px + env(safe-area-inset-bottom));width:40px;height:40px;border-radius:20px;border:2px solid #18181d;background:rgba(244,236,216,.85);color:#18181d;font-size:16px;line-height:36px;text-align:center;padding:0;cursor:pointer;touch-action:none}
  #mute{position:fixed;left:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom));width:40px;height:40px;border-radius:20px;border:2px solid #18181d;background:rgba(244,236,216,.85);color:#18181d;font-size:18px;line-height:38px;text-align:center;padding:0;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="mute" aria-label="Mute">🔊</button>
<button id="pause" aria-label="Pause">⏸</button>
<script src="./game.js?v=6"></script>
</body>
</html>
